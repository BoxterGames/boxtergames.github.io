<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - BoxterGames</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="Images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/studio.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">BoxterGames</a>
        <nav class="nav-links">
            <a href="index.html" data-i18n="nav-games">Games</a>
            <a href="support.html" class="is-active" data-i18n="nav-support">Support</a>
            <a href="privacy.html" data-i18n="nav-privacy">Privacy</a>
            <button type="button" class="lang-toggle" onclick="toggleLanguage()">RU/EN</button>
        </nav>
    </header>

    <main class="page">
        <div class="page-lead" style="text-align: left;">
            <h1 data-i18n="support-title">Support</h1>
            <p data-i18n="support-desc">Need help? Reach out to us!</p>
            <p><strong>Email:</strong> <a href="mailto:support@boxtergames.com">support@boxtergames.com</a></p>
        </div>
        <form class="contact-form" id="contact-form" action="https://formspree.io/f/xvgagzvz" method="POST">
            <input type="text" name="name" data-i18n-placeholder="form-name" placeholder="Your Name" required>
            <input type="email" name="email" data-i18n-placeholder="form-email" placeholder="Your Email" required>
            <textarea name="message" data-i18n-placeholder="form-message" placeholder="Your Message" rows="4" required></textarea>
            <button type="submit" id="submit-btn" data-i18n="submit-btn">Send</button>
            <div class="form-message" id="form-message"></div>
        </form>
    </main>

    <div class="thank-you-modal" id="thank-you-modal" role="dialog" aria-modal="true">
        <span class="thank-you-modal-close" onclick="closeThankYouModal()" aria-label="Close">×</span>
        <div class="content">
            <h2 id="thank-you-title" data-i18n="thank-you-title">Thank You!</h2>
            <p data-i18n="thank-you-desc">We've received your message and will get back to you soon. Thanks for reaching out!</p>
            <a href="#" class="return-btn" data-i18n="return-btn" onclick="closeThankYouModal(); return false;">Close</a>
        </div>
    </div>

    <footer class="site-footer">
        <nav>
            <a href="support.html" data-i18n="nav-support">Support</a>
            <a href="privacy.html" data-i18n="nav-privacy">Privacy</a>
        </nav>
        <p data-i18n="footer-copy">© 2026 BoxterGames. All rights reserved.</p>
    </footer>

    <script src="js/studio.js"></script>
</body>
</html>
