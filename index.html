<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BoxterGames — redirecting</title>
  <script>
    (() => {
      let preference = null;
      try { preference = localStorage.getItem('portfolio-language'); } catch (_) {}

      const language = preference === 'ru' || preference === 'en'
        ? preference
        : (/^ru(?:-|$)/i.test(navigator.language || '') ? 'ru' : 'en');
      const target = language === 'en' ? 'about.en.html' : 'about.html';
      location.replace(target + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>Redirecting to BoxterGames… <a href="about.html">Continue to the website</a>.</p>
</body>
</html>
